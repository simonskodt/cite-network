<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Citation Network</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 320px;
      min-width: 320px;
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }

    #sidebar h1 {
      font-size: 1rem;
      font-weight: 700;
      padding: 20px 16px 12px;
      border-bottom: 1px solid #2d3148;
      color: #7c9ef8;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #search-area {
      padding: 14px 16px;
      border-bottom: 1px solid #2d3148;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row {
      display: flex;
      gap: 6px;
    }

    select {
      background: #252836;
      border: 1px solid #3a3f5c;
      color: #e2e8f0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    input[type="text"] {
      flex: 1;
      background: #252836;
      border: 1px solid #3a3f5c;
      color: #e2e8f0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus { border-color: #7c9ef8; }

    button {
      background: #4a6cf7;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover { background: #3a5ae8; }
    button.secondary { background: #2d3148; }
    button.secondary:hover { background: #3a3f5c; }
    button.danger { background: #c0392b; }
    button.danger:hover { background: #a93226; }

    #results-panel {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #1e2132;
      transition: background 0.1s;
    }

    .result-item:hover { background: #252836; }
    .result-item .title { font-size: 0.85rem; font-weight: 600; color: #a8c4ff; }
    .result-item .meta { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

    /* ── Detail panel ── */
    #detail-panel {
      border-top: 1px solid #2d3148;
      padding: 14px 16px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    #detail-panel.visible { display: flex; }

    #detail-panel h2 { font-size: 0.9rem; color: #7c9ef8; }
    #detail-panel .doi { font-size: 0.75rem; color: #64748b; }
    #detail-panel .year { font-size: 0.8rem; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      background: #252836;
      border: 1px solid #3a3f5c;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.72rem;
      color: #a8c4ff;
    }

    .detail-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .detail-actions button { font-size: 0.75rem; padding: 5px 10px; }

    /* ── Graph canvas ── */
    #graph-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    svg { width: 100%; height: 100%; }

    #status-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 0.72rem;
      color: #64748b;
      background: rgba(15,17,23,0.8);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
    }

    #graph-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #graph-controls button {
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 1rem;
      border-radius: 6px;
      background: #1a1d27;
      border: 1px solid #2d3148;
    }

    /* ── SVG styles ── */
    .node circle {
      stroke-width: 1.5px;
      cursor: pointer;
      transition: r 0.15s;
    }

    .node.selected circle { stroke-width: 3px; }

    .node text {
      font-size: 10px;
      fill: #e2e8f0;
      pointer-events: none;
      paint-order: stroke;
      stroke: #0f1117;
      stroke-width: 3px;
    }

    .link {
      stroke-opacity: 0.5;
      fill: none;
    }

    .link-arrow { fill: #475569; }

    #tooltip {
      position: absolute;
      background: #1a1d27;
      border: 1px solid #3a3f5c;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.78rem;
      color: #e2e8f0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      max-width: 220px;
      z-index: 100;
    }

    #tooltip.visible { opacity: 1; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #3a3f5c;
      border-top-color: #7c9ef8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      padding: 30px 16px;
      text-align: center;
      color: #64748b;
      font-size: 0.82rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <h1>Citation Network</h1>

  <div id="search-area">
    <div class="search-row">
      <select id="search-type">
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="year">Year</option>
        <option value="institution">Institution</option>
      </select>
    </div>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search…" />
      <button id="search-btn">Search</button>
    </div>
    <div class="search-row">
      <button class="secondary" id="load-sample-btn" style="flex:1">Load sample (first 10)</button>
      <button class="secondary" id="clear-btn">Clear</button>
    </div>
  </div>

  <div id="results-panel">
    <div class="empty-state">Search for papers, or load a sample to explore the citation network.</div>
  </div>

  <div id="detail-panel">
    <h2 id="dp-title">—</h2>
    <div class="doi" id="dp-doi"></div>
    <div class="year" id="dp-year"></div>
    <div class="tag-row" id="dp-authors"></div>
    <div class="detail-actions">
      <button id="dp-expand-cited">Cited by this</button>
      <button id="dp-expand-citing">Citing this</button>
      <button class="danger" id="dp-remove">Remove from graph</button>
    </div>
  </div>
</div>

<!-- Graph -->
<div id="graph-area">
  <svg id="graph-svg">
    <defs>
      <marker id="arrow" viewBox="0 -5 10 10" refX="26" refY="0"
              markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,-5L10,0L0,5" fill="#6b7db3"/>
      </marker>
    </defs>
    <g id="graph-root"></g>
  </svg>

  <div id="status-bar">No papers loaded</div>

  <div id="graph-controls">
    <button id="zoom-in-btn" title="Zoom in">+</button>
    <button id="zoom-out-btn" title="Zoom out">−</button>
    <button id="fit-btn" title="Fit to screen">⊡</button>
  </div>

  <div id="tooltip"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  nodes: new Map(),   // paperId → node data
  links: [],          // { source, target } by paperId
  selected: null,
};

// ── D3 setup ───────────────────────────────────────────────────────────────
const svg = d3.select("#graph-svg");
const root = svg.select("#graph-root");
const tooltip = document.getElementById("tooltip");

const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on("zoom", (event) => root.attr("transform", event.transform));

svg.call(zoom);

let simulation = d3.forceSimulation()
  .force("link", d3.forceLink().id(d => d.paperId).distance(160))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter())
  .force("collision", d3.forceCollide(40))
  .on("tick", ticked);

let linkSel = root.append("g").attr("class", "links").selectAll(".link");
let nodeSel = root.append("g").attr("class", "nodes").selectAll(".node");

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const nodes = [...state.nodes.values()];
  const links = state.links.filter(l =>
    state.nodes.has(String(l.source?.paperId ?? l.source)) &&
    state.nodes.has(String(l.target?.paperId ?? l.target))
  );

  linkSel = root.select(".links").selectAll(".link")
    .data(links, d => `${d.source?.paperId ?? d.source}->${d.target?.paperId ?? d.target}`)
    .join(
      enter => enter.append("line")
        .attr("class", "link")
        .attr("stroke", "#6b7db3")
        .attr("stroke-width", 2)
        .attr("marker-end", "url(#arrow)"),
      update => update,
      exit => exit.remove()
    );

  nodeSel = root.select(".nodes").selectAll(".node")
    .data(nodes, d => d.paperId)
    .join(
      enter => {
        const g = enter.append("g").attr("class", "node")
          .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended))
          .on("click", (event, d) => selectNode(d))
          .on("mouseover", (event, d) => showTooltip(event, d))
          .on("mouseout", () => hideTooltip());

        g.append("circle")
          .attr("r", 18)
          .attr("fill", d => colorFor(d))
          .attr("stroke", "#0f1117");

        g.append("text")
          .attr("dy", "0.35em")
          .attr("text-anchor", "middle")
          .attr("y", 28)
          .text(d => truncate(d.title, 24));

        return g;
      },
      update => {
        update.classed("selected", d => state.selected?.paperId === d.paperId);
        update.select("circle").attr("fill", d => colorFor(d));
        return update;
      },
      exit => exit.remove()
    );

  simulation.nodes(nodes);
  simulation.force("link").links(links);
  simulation.alpha(0.3).restart();

  updateStatus();
}

function ticked() {
  linkSel
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

// ── Colour by decade ───────────────────────────────────────────────────────
const colorScale = d3.scaleSequential(d3.interpolateCool).domain([1980, 2024]);

function colorFor(d) {
  if (state.selected?.paperId === d.paperId) return "#f59e0b";
  return colorScale(d.publicationYear || 2000);
}

// ── Node selection ─────────────────────────────────────────────────────────
function selectNode(d) {
  state.selected = d;
  render();
  showDetail(d);
}

function showDetail(d) {
  document.getElementById("dp-title").textContent = d.title;
  document.getElementById("dp-doi").textContent = d.doi ? `DOI: ${d.doi}` : "";
  document.getElementById("dp-year").textContent = d.publicationYear ? `Published: ${d.publicationYear}` : "";

  const authorsEl = document.getElementById("dp-authors");
  authorsEl.innerHTML = "";
  (d.authors || []).forEach(a => {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = a.name;
    authorsEl.appendChild(tag);
  });

  document.getElementById("detail-panel").classList.add("visible");

  document.getElementById("dp-expand-cited").onclick = () => expandCitedBy(d.paperId);
  document.getElementById("dp-expand-citing").onclick = () => expandCiting(d.paperId);
  document.getElementById("dp-remove").onclick = () => removeNode(d.paperId);
}

// ── Graph manipulation ─────────────────────────────────────────────────────
function addPapersToGraph(papers, sourceId) {
  papers.forEach(p => {
    if (!state.nodes.has(String(p.paperId))) {
      state.nodes.set(String(p.paperId), { ...p, x: Math.random() * 200 - 100, y: Math.random() * 200 - 100 });
    }
    if (sourceId) {
      const exists = state.links.some(l =>
        (l.source?.paperId ?? l.source) == sourceId &&
        (l.target?.paperId ?? l.target) == p.paperId
      );
      if (!exists) state.links.push({ source: sourceId, target: p.paperId });
    }
  });
  render();
}

function removeNode(paperId) {
  state.nodes.delete(String(paperId));
  state.links = state.links.filter(l =>
    (l.source?.paperId ?? l.source) != paperId &&
    (l.target?.paperId ?? l.target) != paperId
  );
  if (state.selected?.paperId === paperId) {
    state.selected = null;
    document.getElementById("detail-panel").classList.remove("visible");
  }
  render();
}

// ── API calls ──────────────────────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById("status-bar").textContent = msg;
}

function updateStatus() {
  const n = state.nodes.size;
  const l = state.links.length;
  setStatus(n === 0 ? "No papers loaded" : `${n} paper${n !== 1 ? "s" : ""} · ${l} citation${l !== 1 ? "s" : ""}`);
}

async function apiFetch(url, { allow404 = false } = {}) {
  const res = await fetch(url);
  if (res.status === 404 && allow404) return null;
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function loadSample() {
  setStatus("Loading…");
  try {
    const papers = await apiFetch("/papers");
    addPapersToGraph(papers, null);
    setResultsList(papers);

    // Fetch citations between the loaded papers in parallel
    setStatus("Loading citation edges…");
    await Promise.allSettled(papers.map(p => loadCitationsFor(p.paperId)));
    render(); // draw citation edges now that all links are in state

    updateStatus();
    // Fit after simulation has had time to spread nodes
    setTimeout(fitGraph, 800);
  } catch (e) {
    setStatus("Error: " + e.message);
  }
}

async function loadCitationsFor(paperId) {
  const cited = await apiFetch(`/papers/${paperId}/cited-by`);
  cited.forEach(p => {
    const exists = state.links.some(l =>
      (l.source?.paperId ?? l.source) == paperId &&
      (l.target?.paperId ?? l.target) == p.paperId
    );
    if (!exists) state.links.push({ source: paperId, target: p.paperId });
  });
  simulation.force("link").links(state.links);
  simulation.alpha(0.1).restart();
}

async function search() {
  const type = document.getElementById("search-type").value;
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;

  setStatus("Searching…");
  const urls = {
    title: `/papers/title/${encodeURIComponent(q)}`,
    author: `/papers/author/${encodeURIComponent(q)}`,
    year: `/papers/year/${encodeURIComponent(q)}`,
    institution: `/papers/institution/${encodeURIComponent(q)}`,
  };

  try {
    const result = await apiFetch(urls[type], { allow404: type === "title" });
    if (result === null) {
      setResultsList([]);
      updateStatus();
      return;
    }
    const papers = Array.isArray(result) ? result : [result];
    addPapersToGraph(papers, null);
    setResultsList(papers);
    setTimeout(fitGraph, 600);
  } catch (e) {
    setStatus("Error: " + e.message);
    setResultsList([]);
  }
}

async function expandCitedBy(paperId) {
  setStatus("Loading citations…");
  try {
    const papers = await apiFetch(`/papers/${paperId}/cited-by`);
    const anchorNode = state.nodes.get(String(paperId));
    papers.forEach(p => {
      if (!state.nodes.has(String(p.paperId))) {
        state.nodes.set(String(p.paperId), {
          ...p,
          x: (anchorNode?.x ?? 0) + Math.random() * 100 - 50,
          y: (anchorNode?.y ?? 0) + Math.random() * 100 - 50,
        });
      }
      const exists = state.links.some(l =>
        (l.source?.paperId ?? l.source) == paperId &&
        (l.target?.paperId ?? l.target) == p.paperId
      );
      if (!exists) state.links.push({ source: paperId, target: p.paperId });
    });
    render();
    setTimeout(fitGraph, 600);
  } catch (e) {
    setStatus("Error: " + e.message);
  }
}

async function expandCiting(paperId) {
  setStatus("Loading citing papers…");
  try {
    const papers = await apiFetch(`/papers/${paperId}/citing`);
    const anchorNode = state.nodes.get(String(paperId));
    papers.forEach(p => {
      if (!state.nodes.has(String(p.paperId))) {
        state.nodes.set(String(p.paperId), {
          ...p,
          x: (anchorNode?.x ?? 0) + Math.random() * 100 - 50,
          y: (anchorNode?.y ?? 0) + Math.random() * 100 - 50,
        });
      }
      const exists = state.links.some(l =>
        (l.source?.paperId ?? l.source) == p.paperId &&
        (l.target?.paperId ?? l.target) == paperId
      );
      if (!exists) state.links.push({ source: p.paperId, target: paperId });
    });
    render();
    setTimeout(fitGraph, 600);
  } catch (e) {
    setStatus("Error: " + e.message);
  }
}

// ── Results list ───────────────────────────────────────────────────────────
function setResultsList(papers) {
  const panel = document.getElementById("results-panel");
  if (papers.length === 0) {
    panel.innerHTML = '<div class="empty-state">No results found.</div>';
    return;
  }
  panel.innerHTML = papers.map(p => `
    <div class="result-item" data-id="${p.paperId}">
      <div class="title">${escHtml(p.title)}</div>
      <div class="meta">${p.publicationYear || "—"} · ${p.doi || "no DOI"}</div>
    </div>
  `).join("");

  panel.querySelectorAll(".result-item").forEach(el => {
    el.addEventListener("click", () => {
      const d = state.nodes.get(el.dataset.id);
      if (d) selectNode(d);
    });
  });
}

// ── Zoom controls ──────────────────────────────────────────────────────────
document.getElementById("zoom-in-btn").onclick = () => svg.transition().call(zoom.scaleBy, 1.4);
document.getElementById("zoom-out-btn").onclick = () => svg.transition().call(zoom.scaleBy, 0.7);
document.getElementById("fit-btn").onclick = fitGraph;

function fitGraph() {
  const { width, height } = svg.node().getBoundingClientRect();
  const nodes = [...state.nodes.values()];
  if (nodes.length === 0) return;

  const xs = nodes.map(n => n.x);
  const ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const gw = maxX - minX || 1, gh = maxY - minY || 1;
  const scale = Math.min(width / (gw + 120), height / (gh + 120), 2);
  const tx = width / 2 - scale * (minX + maxX) / 2;
  const ty = height / 2 - scale * (minY + maxY) / 2;

  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ── Drag ───────────────────────────────────────────────────────────────────
function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── Tooltip ────────────────────────────────────────────────────────────────
function showTooltip(event, d) {
  tooltip.textContent = d.title + (d.publicationYear ? ` (${d.publicationYear})` : "");
  tooltip.classList.add("visible");
  moveTooltip(event);
}
function hideTooltip() { tooltip.classList.remove("visible"); }
svg.node().addEventListener("mousemove", (e) => { if (tooltip.classList.contains("visible")) moveTooltip(e); });

function moveTooltip(event) {
  const rect = document.getElementById("graph-area").getBoundingClientRect();
  let x = event.clientX - rect.left + 12;
  let y = event.clientY - rect.top + 12;
  if (x + 230 > rect.width) x -= 244;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

// ── Simulation center on resize ────────────────────────────────────────────
function updateSimulationCenter() {
  const { width, height } = svg.node().getBoundingClientRect();
  simulation.force("center", d3.forceCenter(width / 2, height / 2));
}

new ResizeObserver(updateSimulationCenter).observe(svg.node());
updateSimulationCenter();

// ── Wire up UI ─────────────────────────────────────────────────────────────
document.getElementById("search-btn").onclick = search;
document.getElementById("search-input").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
document.getElementById("load-sample-btn").onclick = loadSample;
document.getElementById("clear-btn").onclick = () => {
  state.nodes.clear();
  state.links.length = 0;
  state.selected = null;
  document.getElementById("detail-panel").classList.remove("visible");
  document.getElementById("results-panel").innerHTML = '<div class="empty-state">Graph cleared.</div>';
  render();
};

// ── Helpers ────────────────────────────────────────────────────────────────
function truncate(str, n) { return str && str.length > n ? str.slice(0, n) + "…" : str; }
function escHtml(s) { return s?.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") ?? ""; }
</script>
</body>
</html>
